# Supabase CLI 설정(이 저장소에서 쓰는 부분만).
# project_id 는 로컬 CLI 식별용 이름일 뿐(운영 프로젝트 ref 아님).
project_id = "sigyemin-stock-practice"

# fund-grant 는 새 API 키(publishable) 방식이라 플랫폼 verify_jwt 대신 함수 코드에서 사용자 JWT 를 확인한다.
[functions.fund-grant]
verify_jwt = false

# M2: 모두 코드에서 확인한다(instrument-lookup = 사용자 JWT, 나머지 = cron 토큰 x-cron-token)
[functions.instrument-lookup]
verify_jwt = false

[functions.tick-kr]
verify_jwt = false

[functions.tick-us]
verify_jwt = false

[functions.fx-sync]
verify_jwt = false

[functions.ref-sync]
verify_jwt = false

# M3: 사용자 JWT 를 코드에서 확인(publishable 키 방식)
[functions.place-order]
verify_jwt = false

[functions.cancel-order]
verify_jwt = false

# M4: fx-convert·tax-pay = 사용자 JWT, daily-close·tax-annual = cron 토큰(x-cron-token)
[functions.fx-convert]
verify_jwt = false

[functions.tax-pay]
verify_jwt = false

[functions.daily-close]
verify_jwt = false

[functions.tax-annual]
verify_jwt = false
